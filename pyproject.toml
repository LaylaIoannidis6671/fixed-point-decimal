[project]
name = "fixed-point-decimal"
version = "0.1.0"
description = "Decimal arithmetic with a fixed number of digits after the decimal point using plain integers, avoiding the standard library Decimal's overhead."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
